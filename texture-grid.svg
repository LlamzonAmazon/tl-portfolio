<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140">
  <defs>
    <linearGradient id="fadeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E5E5E" stop-opacity="0.03"/>
      <stop offset="32%" stop-color="#5E5E5E" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#5E5E5E" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#5E5E5E" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="fadeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5E5E5E" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#5E5E5E" stop-opacity="0.02"/>
      <stop offset="72%" stop-color="#5E5E5E" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#5E5E5E" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- minor verticals: irregular opacity, some faded, one broken -->
  <line x1="28" y1="0" x2="28" y2="140" stroke="url(#fadeV)" stroke-width="1"/>
  <line x1="56" y1="0" x2="56" y2="140" stroke="#0B0B0B" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="84" y1="0" x2="84" y2="140" stroke="url(#fadeV)" stroke-width="1"/>
  <line x1="112" y1="0" x2="112" y2="140" stroke="#0B0B0B" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="9 3 14 4 6 5"/>

  <!-- minor horizontals: irregular opacity, some faded, one broken -->
  <line x1="0" y1="28" x2="140" y2="28" stroke="url(#fadeH)" stroke-width="1"/>
  <line x1="0" y1="56" x2="140" y2="56" stroke="#0B0B0B" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="84" x2="140" y2="84" stroke="url(#fadeH)" stroke-width="1"/>
  <line x1="0" y1="112" x2="140" y2="112" stroke="#0B0B0B" stroke-opacity="0.065" stroke-width="1" stroke-dasharray="11 3 8 5 5 4"/>

  <!-- major rule: every tile edge (every 5th line), slightly stronger — the "heavier ruled" line -->
  <line x1="0" y1="0" x2="0" y2="140" stroke="#5E5E5E" stroke-opacity="0.2" stroke-width="1.2"/>
  <line x1="0" y1="0" x2="140" y2="0" stroke="#5E5E5E" stroke-opacity="0.2" stroke-width="1.2"/>
</svg>
